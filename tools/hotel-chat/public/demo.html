<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 40px auto; max-width: 640px; padding: 0 16px; color: #222; }
      code { background: #f0f2f5; padding: 2px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1 id="name">Widget demo</h1>
    <p>Bu sayfa widget'ı denemek içindir. Sağ alttaki düğmeye tıklayın.</p>
    <p>Otel: <a href="/">Pati Koy (örnek site)</a> · <a href="?hotel=demo-otel">demo-otel</a></p>
    <p>Gömme kodu: <code id="embed"></code></p>
    <script>
      // Otel kimliği adresten okunur: /demo?hotel=pati-koy
      var hotel = new URLSearchParams(location.search).get("hotel") || "pati-koy";
      if (!/^[a-z0-9-]+$/.test(hotel)) hotel = "pati-koy";
      // Pati Koy'un kendi tanıtım sitesi var; eski demo linkleri oraya gider.
      if (hotel === "pati-koy") location.replace("/");
      document.getElementById("name").textContent = "Widget demo: " + hotel;
      document.getElementById("embed").textContent =
        '<script src="/widget.js" data-hotel="' + hotel + '" async></' + "script>";
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.dataset.hotel = hotel;
      document.body.appendChild(s);
    </script>
  </body>
</html>
